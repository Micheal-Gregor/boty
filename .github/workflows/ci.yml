name: CI

on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The engine has zero runtime dependencies, so there's nothing to install — just run the
      # proof suite (Stages 1–4).
      - name: Run engine tests
        run: npm test
        working-directory: packages/engine
